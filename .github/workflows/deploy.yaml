name: D2D Store API CI/CD

# Pull requests run the checks only. Pushes to develop run the checks, then deploy.
on:
  pull_request:
  push:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: api-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PIPENV_VERBOSITY: -1
      # Enough for settings to load; no database is needed for these checks
      DEBUG: "true"
      SECRET: ci-only-not-secret

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pipenv

      - name: Install pipenv and the locked dev environment
        run: |
          pip install pipenv
          pipenv install --dev --deploy

      - name: Formatting (autopep8)
        run: pipenv run format-check

      - name: Django system checks
        run: pipenv run python manage.py check

      # Production installs from requirements.txt with pip, so it must match Pipfile.lock
      - name: requirements.txt matches Pipfile.lock
        run: |
          pipenv requirements --hash > /tmp/requirements.txt
          diff -u requirements.txt /tmp/requirements.txt || {
            echo "::error::requirements.txt is stale. Run: pipenv requirements --hash > requirements.txt"
            exit 1
          }

      # The frontend generates its types from a copy of this file
      - name: schema.graphql matches the code
        run: |
          pipenv run graphql-schema
          git diff --exit-code schema.graphql || {
            echo "::error::schema.graphql is stale. Run: pipenv run graphql-schema, and copy it to the frontend"
            exit 1
          }

  deploy:
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Holds the deploy secrets; add required reviewers here to gate production deploys
    environment: production

    steps:
      - name: Deploy over SSH (server-side build)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script_stop: true
          script: |
            set -euo pipefail

            REPO_DIR="${DEPLOY_PATH:-${{ secrets.PROJECT_ROOT_DIR }}}"
            BRANCH="${DEPLOY_BRANCH:-develop}"
            SERVICE_NAME="${SERVICE_NAME:-gunicorn.service}"

            if [ ! -d "$REPO_DIR/.git" ]; then
              echo "Missing the git repository at $REPO_DIR"
              exit 1
            fi

            cd "$REPO_DIR"
            git fetch origin "$BRANCH"
            git checkout "$BRANCH"
            git pull --ff-only origin "$BRANCH"

            python3.12 -m venv .venv
            .venv/bin/pip install --upgrade pip
            .venv/bin/pip install -r requirements.txt

            set -a; source .env; set +a

            .venv/bin/python manage.py migrate --noinput
            .venv/bin/python manage.py collectstatic --noinput

            sudo systemctl restart "$SERVICE_NAME"
            echo "Deployed $(git rev-parse --short HEAD)"
