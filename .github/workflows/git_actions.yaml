name: D2D Store API CI/CD

# Pull requests run the checks only. Pushes to develop run the checks, then deploy.
on:
  pull_request:
  push:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: api-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PIPENV_VERBOSITY: -1
      # Enough for settings to load; no database is needed for these checks
      DEBUG: "true"
      SECRET: ci-only-not-secret

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pipenv

      - name: Install pipenv and the locked dev environment
        run: |
          pip install pipenv
          pipenv install --dev --deploy

      - name: Formatting (autopep8)
        run: pipenv run format-check

      - name: Django system checks
        run: pipenv run python manage.py check

      # Production installs from requirements.txt with pip, so it must match Pipfile.lock
      - name: requirements.txt matches Pipfile.lock
        run: |
          pipenv requirements --hash > /tmp/requirements.txt
          diff -u requirements.txt /tmp/requirements.txt || {
            echo "::error::requirements.txt is stale. Run: pipenv requirements --hash > requirements.txt"
            exit 1
          }

      # The frontend generates its types from a copy of this file
      - name: schema.graphql matches the code
        run: |
          pipenv run graphql-schema
          git diff --exit-code schema.graphql || {
            echo "::error::schema.graphql is stale. Run: pipenv run graphql-schema, and copy it to the frontend"
            exit 1
          }

  deploy:
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Holds the deploy secrets; add required reviewers here to gate production deploys
    environment: production

    env:
      SSH_PORT: ${{ secrets.SSH_PORT }}

    steps:
      # Key based auth with a pinned host key, instead of a password piped into sudo
      - name: Set up SSH
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          echo "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          printf 'Host target\n  HostName %s\n  User %s\n  Port %s\n  IdentityFile ~/.ssh/id_deploy\n  IdentitiesOnly yes\n  StrictHostKeyChecking yes\n' \
            "${{ secrets.SSH_HOST }}" "${{ secrets.SSH_USERNAME }}" "$SSH_PORT" > ~/.ssh/config

      # Production uses a plain venv (.venv) filled from requirements.txt; pipenv is for development.
      # The deploy user may only run the two systemctl commands below without a password, eg:
      #   /etc/sudoers.d/d2dstore:
      #   deploy ALL=(root) NOPASSWD: /usr/bin/systemctl daemon-reload, /usr/bin/systemctl restart gunicorn.service
      - name: Deploy
        run: |
          ssh target ROOT="'${{ secrets.PROJECT_ROOT_DIR }}'" SHA="'${{ github.sha }}'" bash -s <<'EOF'
          set -euo pipefail
          cd "$ROOT"

          git fetch --quiet origin develop
          git checkout --quiet --force "$SHA"

          if [ ! -x .venv/bin/python ]; then
            python3.12 -m venv .venv
          fi
          .venv/bin/pip install --quiet --upgrade pip
          .venv/bin/pip install --quiet --require-hashes -r requirements.txt

          .venv/bin/python manage.py check --deploy --fail-level ERROR
          .venv/bin/python manage.py migrate --noinput
          .venv/bin/python manage.py collectstatic --noinput --clear
          .venv/bin/python manage.py crontab add

          sudo -n /usr/bin/systemctl daemon-reload
          sudo -n /usr/bin/systemctl restart gunicorn.service
          echo "Deployed $(git rev-parse --short HEAD)"
          EOF

      - name: Remove the SSH key
        if: always()
        run: rm -rf ~/.ssh
