# Formatter settings; matches .editorconfig and .vscode/settings.json
# Run: pipenv run format        Check (CI): pipenv run format-check
[tool.autopep8]
max_line_length = 100
recursive = true
exclude = "*/migrations/*,.venv,venv,django_static"
# The code base is indented with tabs (see .editorconfig), so leave indentation rules alone:
# W191 tabs, E101 mixed indentation, E11x/E12x/E13x indent width and continuation lines.
# E501 too: autopep8 wraps long lines with spaces, which mixes tabs and spaces.
ignore = "W191,E101,E111,E114,E115,E116,E117,E12,E13,E501,W503,W504"

# Linter settings. Run: pipenv run pylint apps app_utils d2dstore api
[tool.pylint.main]
# Teaches pylint about Django (model fields, managers, DoesNotExist, ...)
load-plugins = ["pylint_django"]
django-settings-module = "d2dstore.settings"
ignore = ["migrations"]

[tool.pylint.format]
# Same as .editorconfig and autopep8
indent-string = "\t"
max-line-length = 100

[tool.pylint."messages control"]
disable = [
	# Docstrings are written where they help, not on every Meta class and resolver
	"missing-module-docstring",
	"missing-class-docstring",
	"missing-function-docstring",
	# Django Meta classes and graphene types/mutations are small classes on deep hierarchies
	"too-few-public-methods",
	"too-many-ancestors",
]
# Graphene schema modules disable these at the top of the file instead, because there:
# - resolvers receive the model instance first, not self (no-self-argument, no-member)
# - 'id' and 'input' are GraphQL argument names, so renaming them changes the API (redefined-builtin)
