type AppQuery {
  behaviorsList(searchKey: String): BehaviorPaginatorType

  """Items the owner can budget for and tag transactions with."""
  budgetItems(
    householdId: ID

    """
    Settings view: also list archived own items and every system item, with `enabled` showing whether the owner switched it on.
    """
    includeDisabled: Boolean = false
  ): [BudgetItemType!]!

  """Admin: every system item, including inactive ones."""
  systemBudgetItems: [BudgetItemType!]!
  budgets(
    householdId: ID
    searchKey: String
    status: String

    """Budgets whose period overlaps date_from..date_to"""
    dateFrom: Date
    dateTo: Date
    pageCount: Int = 10
    pageNumber: Int = 1
  ): BudgetPaginatorType
  budget(id: ID!, householdId: ID): BudgetType

  """The active budget covering a date (today by default), if any."""
  activeBudget(householdId: ID, date: Date): BudgetType
  myHouseholdMemberships: [HouseholdMemberType]
  households: [HouseholdType]
  dbBackup: DbBackupType
  salaries(createdAt: Date, pageCount: Int, pageNumber: Int): SalaryPaginatorType
  rateCurrencies(amount: Float, base: String, targets: [String], period: String): [ConvertedCurrencyType]
  properties(search: String, isActive: String, pageCount: Int, pageNumber: Int): PropPaginatorType
  propertiesDetail(isActive: String): PropertyDetailType
  stores(
    searchKey: String
    searchDateFrom: String
    searchDateTo: String
    searchType: String
    pageCount: Int
    pageNumber: Int
    storeType: String
    searchMember: String
    transactionType: String

    """Only expenses tagged with this budget item"""
    itemId: String
  ): StorePaginatorType
  store(id: String!): StoreType
  totalInflow(storeType: String): Int
  totalOutflow(storeType: String): Int
  storeCount: Int
  monthlyStore(isInflow: Boolean, time: String): [MonthType]
  storeAggregate(storeType: String): StoreRatioType
  recurringStores(searchKey: String): RecurringStorePaginatorType
  triggerStoreReport(reportType: String): String
  me: UserType
  welcome: WelcomeType
  users(
    search: String

    """'active', 'invited' or 'disabled'; all when empty"""
    status: String
    pageCount: Int
    pageNumber: Int
  ): PaginatorManagedUserType
  userSettings: UserSettingsType
  currencies: [CurrencyType]
  mfaStatus: MfaStatusType!
  _debug: DjangoDebug
}

