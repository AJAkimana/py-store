type AppMutations {
  """Mutation to create a budget. Inherits from 'CreateEditBehavior' class"""
  evaluateBehavior(actionDate: Date!, description: String, householdId: String, name: String!, rate: String): EvaluateBehavior

  """
  Create an item for the owner, or a system item (admins, `isSystem: true`).
  Re-creating an archived item with the same name brings it back.
  """
  createBudgetItem(defaultAmount: Float, description: String, householdId: ID, isSystem: Boolean = false, name: String!): CreateBudgetItem
  updateBudgetItem(defaultAmount: Float, description: String, householdId: ID, id: ID!, isActive: Boolean, name: String): UpdateBudgetItem

  """
  Delete an item. Items already used in budgets or transactions are archived instead,
  so history keeps its labels.
  """
  deleteBudgetItem(householdId: ID, id: ID!): DeleteBudgetItem

  """Switch a system item on or off for the owner's account."""
  setSystemItemEnabled(enabled: Boolean!, householdId: ID, itemId: ID!): SetSystemItemEnabled

  """
  Create a budget for any period. It starts as a draft unless `status: "active"`.
  """
  createBudget(allocations: [AllocationInput!], description: String, endDate: Date!, householdId: ID, name: String!, startDate: Date!, status: String = "draft"): CreateBudget

  """Update a budget's details. Closed budgets must be reopened first."""
  updateBudget(description: String, endDate: Date, householdId: ID, id: ID!, name: String, startDate: Date): UpdateBudget

  """Replace the items and amounts a budget plans for."""
  setBudgetAllocations(allocations: [AllocationInput!]!, budgetId: ID!, householdId: ID): SetBudgetAllocations

  """draft → active → closed. Active budgets of one owner can't overlap."""
  setBudgetStatus(householdId: ID, id: ID!, status: String!): SetBudgetStatus

  """
  Start a new draft budget for another period with the same items and amounts.
  Items the owner can no longer use are left out.
  """
  copyBudget(endDate: Date!, householdId: ID, id: ID!, name: String!, startDate: Date!): CopyBudget
  deleteBudget(householdId: ID, id: ID!): DeleteBudget

  """
  Mutation to create a household. Inherits from 'CreateEditHousehold' class
  """
  createHousehold(description: String!, name: String!): CreateHousehold
  calculateSalary(facilities: [FacilityType], grossSalary: Float, maternityPercent: Float, netPay: Float, netSalary: Float, pensionPercent: Float): CalculateSalary
  createProperty(coverImage: String, description: String!, isActive: Boolean, name: String!, price: Float!): CreateProperty
  addPropDetail(amount: Float!, isInflow: Boolean!, propertyId: UUID!, title: String!): AddPropDetail
  updatePropDetail(amount: Float!, isInflow: Boolean!, propDetailId: UUID!, propertyId: UUID!, title: String!): UpdatePropDetail

  """
  Login a users with their credentials
  
  args:
  password(str): user's registered password
  email(str): user's registered email
  
  returns:
  message(str): success messsage confirming login
  token(str): JWT authorization token used to validate the login
  rest_token(str): JWT token used to validate REST endpoint access
  user(obj): 'User' object containing details of the logged in users
  
  The refresh token is set as an HttpOnly cookie, never returned in the body.
  
  When two-factor authentication is on, no session is issued: the response has
  mfa_required=True and an mfa_token to send to 'verifyMfaLogin' with the code.
  
  When the user signed in with an invite's temporary password, no session is issued:
  the response has password_change_required=True and a password_change_token to send
  to 'setInitialPassword', after which the client signs in with the new password.
  """
  loginUser(email: String, password: String): LoginUser

  """
  Second login step. 'method' is 'totp', 'email' or 'recovery'.
  On success it issues the session exactly like 'loginUser'.
  """
  verifyMfaLogin(code: String!, method: String!, mfaToken: String!): VerifyMfaLogin
  resetPassword(email: String, newPassword: String, oldPassword: String): ResetPassword

  """
  Update the logged-in user's own profile. Only the fields sent are changed.
  Passwords are changed through 'ResetPassword', which checks the old one.
  """
  updateUserProfile(firstName: String, lastName: String, phone: String): UpdateUserProfile
  logoutUser: LogoutUser

  """
  Issue a new JWT using the refresh token cookie.
  The refresh token is rotated: the old one is revoked and a new cookie is set.
  """
  refreshToken: RefreshToken
  sendConfirmationEmail: SendConfirmationEmail

  """
  This mutation is used to configure user settings like notifications, alert thresholds,
  default currency and appearance (theme mode and accent colors).
  """
  configureUserSettings(budgetAlertThreshold: Int, budgetAlertsEnabled: Boolean, defaultCurrency: String, emailNotifications: Boolean, primaryColor: String, pushNotifications: Boolean, secondaryColor: String, themeMode: String): ConfigureUserSettings

  """
  Begin adding an authenticator app. Asks for the password again so a stolen
  session can't attach the attacker's app and lock the owner out.
  The returned secret only works after 'confirmTotpSetup'.
  """
  startTotpSetup(password: String!): StartTotpSetup

  """
  Turn the authenticator app on with a code from it. 'recoveryCodes' is filled only
  when this is the account's first 2FA method; show the codes once, they aren't stored.
  """
  confirmTotpSetup(code: String!): ConfirmTotpSetup

  """
  Email a code to the account's address. Send it back with the returned
  'setupToken' to 'confirmEmailOtpSetup'. No password needed: only the mailbox
  owner can read the code, so a stolen session can't turn this on by itself.
  """
  startEmailOtpSetup: StartEmailOtpSetup
  resendEmailOtpSetupCode(setupToken: String!): ResendEmailOtpSetupCode

  """
  Turn email codes on. 'recoveryCodes' is filled only for the account's first 2FA method.
  """
  confirmEmailOtpSetup(code: String!, setupToken: String!): ConfirmEmailOtpSetup

  """Choose which method the login screen starts with: 'totp' or 'email'."""
  setPreferredMfaMethod(method: String!): SetPreferredMfaMethod

  """
  Public: during login, email a code for the pending challenge. Also used when the
  user switches from the authenticator app to email. Limited to one send a minute.
  """
  resendMfaEmailCode(mfaToken: String!): ResendMfaEmailCode

  """
  Email a code to confirm turning 2FA off or replacing recovery codes.
  Without 'actionToken' it starts a new check; with it, it resends the code.
  """
  sendMfaActionEmailCode(actionToken: String): SendMfaActionEmailCode

  """
  Turn two-factor authentication off. Needs the password and a current code
  ('method' is 'totp', 'email' with 'actionToken', or 'recovery').
  Other sessions are signed out.
  """
  disableMfa(actionToken: String, code: String!, method: String!, password: String!): DisableMfa

  """
  Replace all recovery codes after checking a current code. Show the new ones once.
  """
  regenerateRecoveryCodes(actionToken: String, code: String!, method: String!): RegenerateRecoveryCodes

  """
  Public: email a password reset code. The response is the same whether or not
  the email has an account. Call again to resend (at most once a minute).
  """
  requestPasswordReset(email: String!): RequestPasswordReset

  """
  Public: set a new password with the emailed code. Doesn't sign in, and signs out
  every device, including the one making the request.
  """
  resetPasswordWithCode(code: String!, newPassword: String!, resetToken: String!): ResetPasswordWithCode

  """
  Public: replace an invite's temporary password, with the token from 'loginUser'.
  Doesn't sign in; sign in again with the new password.
  """
  setInitialPassword(newPassword: String!, passwordChangeToken: String!): SetInitialPassword

  """
  Administrator: create a regular user with their own household and email them an
  invite with a temporary password. If 'inviteSent' is false, resend the invite.
  """
  createUser(input: UserInput!): CreateUser

  """
  Administrator: change a user's details (only fields sent). A new email signs the
  user out everywhere; a pending invite is re-sent to it ('inviteSent').
  """
  updateUser(id: ID!, input: UserInput!): UpdateUser

  """
  Administrator: disable (signs out everywhere, keeps data) or re-enable a user.
  """
  setUserActive(active: Boolean!, id: ID!): SetUserActive

  """
  Administrator: email a new temporary password to a user who hasn't signed in yet.
  """
  resendUserInvite(id: ID!): ResendUserInvite

  """Mutation to create a store. Inherits from 'CreateEditStore' class"""
  createStore(
    actionDate: Date!
    amount: Float!
    description: String!
    householdId: String!
    isInflow: Boolean!
    isRecurring: Boolean

